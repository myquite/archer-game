<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="CRYPTBOW" />
  <meta name="theme-color" content="#1f1430" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>CRYPTBOW</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="cabinet">
    <!-- 16-BIT BEVELED PLUM/CHARCOAL TOP HUD -->
    <header class="hud-top panel">
      <div class="top-row">
        <div class="top-left">
          <span id="hud-floor" class="chip floor-chip">F1</span>
          <span id="hud-wave" class="chip wave-chip">W1/3</span>
          <span class="chip foe-chip">
            <span data-px-icon="skull" data-px-size="14"></span>
            <span id="hud-left">16</span>
          </span>
        </div>

        <div class="top-right">
          <span class="chip gold-chip">
            <span data-px-icon="coin" data-px-size="14"></span>
            <span id="hud-gold">25</span>
          </span>
          <button id="btn-gear" class="icon-btn gear-btn" title="Forge &amp; Gear">
            <span data-px-icon="anvil" data-px-size="18"></span>
          </button>
          <button id="btn-mute" class="icon-btn" title="Audio Mode"></button>
        </div>
      </div>

      <!-- RAZOR PIXEL XP BAR + ICON-ONLY BUILD BADGES -->
      <div class="xp-strip">
        <span id="hud-lvl" class="lvl-pip">LV 1</span>
        <div class="bar-track xp-track">
          <div id="bar-xp" class="bar-fill xp-fill" style="width: 0%"></div>
        </div>
        <div id="hud-badges" class="badges-inline hidden"></div>
      </div>
    </header>

    <!-- FULL-BLEED PORTRAIT SPRITE-STACKED VIEWPORT -->
    <main class="stage-wrap">
      <canvas id="game-canvas"></canvas>

      <!-- 16-BIT TITLE OVERLAY -->
      <div id="overlay-title" class="modal-backdrop">
        <div class="modal-card title-card">
          <div class="title-emblem">
            <img class="title-emblem-img" src="icon-192.png" alt="CRYPTBOW" width="64" height="64" />
          </div>
          <h1 class="game-title">CRYPTBOW</h1>
          <div id="title-best" class="title-sub">5 CHAPTERS · 16 GEAR SETS</div>
          <div class="chapter-picker">
            <div id="chapter-pills" class="chapter-pills"></div>
            <div id="chapter-label" class="chapter-label">CH 1 · TORCHLIT CRYPTS (F1)</div>
          </div>
          <div class="pill-tips">
            <div class="tip-pill">
              <span data-px-icon="tip_move" data-px-size="16"></span>
              <span><b>MOVE</b> TO CHARGE · <b>STOP</b> TO SNAP</span>
            </div>
            <div class="tip-pill">
              <span data-px-icon="tip_warn" data-px-size="16"></span>
              <span><b>DODGE</b> RED RINGS &amp; FLANK SHIELDS</span>
            </div>
          </div>
          <button id="btn-start" class="pixel-btn primary-btn play-btn">PLAY</button>
        </div>
      </div>

      <!-- LEVEL-UP DRAFT -->
      <div id="overlay-levelup" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header gold">LEVEL UP</div>
          <div id="levelup-cards" class="choice-list"></div>
          <button id="btn-reroll-up" class="pixel-btn reroll-btn"></button>
        </div>
      </div>

      <!-- RELIC CHEST DRAFT -->
      <div id="overlay-relic" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header gold">RELIC CHEST</div>
          <div id="relic-cards" class="choice-list"></div>
          <button id="btn-reroll-relic" class="pixel-btn reroll-btn"></button>
        </div>
      </div>

      <!-- NEXT FLOOR PATH PICKER -->
      <div id="overlay-doors" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header purple">NEXT FLOOR</div>
          <div id="door-cards" class="choice-list"></div>
        </div>
      </div>

      <!-- MASTER BLACKSMITH FORGE -->
      <div id="overlay-blacksmith" class="modal-backdrop hidden">
        <div class="modal-card forge-card">
          <div class="forge-head">
            <span class="modal-title-sm gold">
              <span data-px-icon="anvil" data-px-size="18"></span>
              <span>FORGE</span>
            </span>
            <span class="chip gold-chip">
              <span data-px-icon="coin" data-px-size="14"></span>
              <span id="forge-gold">0</span>
            </span>
          </div>

          <div class="forge-actions">
            <button id="btn-temper" class="pixel-btn small-btn forge-act-btn">
              <span data-px-icon="sword" data-px-size="16"></span>
              <span>+16%</span>
              <b class="gold">45g</b>
            </button>
            <button id="btn-heal" class="pixel-btn small-btn heal-btn forge-act-btn">
              <span data-px-icon="heart" data-px-size="16"></span>
              <span>HEAL</span>
              <b class="gold">35g</b>
            </button>
            <button id="btn-buy-rerolls" class="pixel-btn small-btn dice-btn forge-act-btn">
              <span data-px-icon="dice" data-px-size="16"></span>
              <span>+2</span>
              <b class="gold">30g</b>
            </button>
          </div>

          <div class="forge-tabs">
            <button id="tab-weapons" class="tab-btn active">BOWS</button>
            <button id="tab-armors" class="tab-btn">ARMOR</button>
          </div>

          <div id="forge-weapons" class="forge-grid"></div>
          <div id="forge-armors" class="forge-grid hidden"></div>

          <button id="btn-leave-forge" class="pixel-btn primary-btn">CONTINUE ▶</button>
        </div>
      </div>

      <!-- CURSED ALTAR -->
      <div id="overlay-cursed" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header crimson">CURSED ALTAR</div>
          <div id="cursed-cards" class="choice-list"></div>
          <button id="btn-decline-curse" class="pixel-btn small-btn">SKIP</button>
        </div>
      </div>

      <!-- GAME OVER -->
      <div id="overlay-gameover" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header crimson">DEFEATED</div>
          <div id="gameover-stats" class="stats-grid"></div>
          <button id="btn-restart" class="pixel-btn primary-btn play-btn">PLAY AGAIN</button>
        </div>
      </div>
    </main>

    <!-- 16-BIT BEVELED BOTTOM VITALS + PIXEL-ART SKILL BAR -->
    <footer class="hud-bottom panel">
      <div class="vitals-row">
        <div class="bar-track vital-track">
          <div id="bar-hp" class="bar-fill hp-fill" style="width: 100%"></div>
          <div class="bar-text">
            <span data-px-icon="heart" data-px-size="12"></span>
            <span id="txt-hp">100/100</span>
          </div>
        </div>
        <div class="bar-track vital-track">
          <div id="bar-mana" class="bar-fill mana-fill" style="width: 100%"></div>
          <div class="bar-text">
            <span data-px-icon="mana" data-px-size="12"></span>
            <span id="txt-mana">100/100</span>
          </div>
        </div>
      </div>

      <div class="quickbar">
        <button id="skill-roll" class="skill-btn" data-skill="roll">
          <span class="sk-corner kb-only">SPC</span>
          <span class="sk-mp">15</span>
          <span class="sk-ico" data-px-icon="skill_roll" data-px-size="28"></span>
          <span class="sk-name">ROLL</span>
          <div class="sk-cd-mask" id="cd-roll"></div>
        </button>
        <button id="skill-volley" class="skill-btn" data-skill="volley">
          <span class="sk-corner kb-only">E</span>
          <span class="sk-mp">30</span>
          <span class="sk-ico" data-px-icon="skill_volley" data-px-size="28"></span>
          <span class="sk-name">VOLLEY</span>
          <div class="sk-cd-mask" id="cd-volley"></div>
        </button>
        <button id="skill-snare" class="skill-btn" data-skill="snare">
          <span class="sk-corner kb-only">R</span>
          <span class="sk-mp">25</span>
          <span class="sk-ico" data-px-icon="skill_snare" data-px-size="28"></span>
          <span class="sk-name">SNARE</span>
          <div class="sk-cd-mask" id="cd-snare"></div>
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
